# Ferni - a self-learning Delta agent on Telegram, one always-on Fly machine.
# It runs continuously (the connector must never miss a message).
#
# ONE public surface (0.4.0): the secure secret-intake listener below. Telegram long-poll is
# still outbound-only; the daemon seam (8321) and the schedule control server (8322) remain
# loopback-bound. Port 8323 serves exactly two routes, GET/POST /intake/:session, and returns
# an empty 404 for anything else.
app = "ferni-delta-connect"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8321"
  # loopback-only: the daemon's HTTP seam must NOT be reachable on Fly's org
  # private network - only the connector (same machine) talks to it.
  DELTA_BIND = "127.0.0.1"
  DELTA_BASE_URL = "http://127.0.0.1:8321"
  DELTA_CONTROL_URL = "http://127.0.0.1:8322"
  # all durable state on the volume
  DELTA_DB = "/data/delta.db"
  DELTA_WORKSPACE = "/data/bundle"
  # D-7: engine scratch (spill/research/scratchpad) lives beside the DB, off the bundle —
  # the workspace is the agent's document tree, not a dump for untrusted intermediate state.
  DELTA_SCRATCH_DIR = "/data/scratch"
  CONNECT_DB = "/data/connect.sqlite"
  # provider: the ferni-codex-sol migration (planned in 0.2.15, unblocked by the D-12 gate,
  # applied on 0.2.16) — GPT-5.6 Sol via the ChatGPT/Codex SUBSCRIPTION backend, broker-minted
  # bearer (~$0 marginal; cost_usd meters the API-rate equivalent). NOTE: 0.2.16's new
  # Responses fields (reasoning carry, phase, breakpoints, verbosity, summaries) are
  # allowlisted to openai.com and NOT sent to this host until the Delos probe battery passes —
  # this lane's wire is byte-identical to 0.2.15, including the D-12 max_output_tokens
  # suppression that keeps delegation alive here. OpenRouter (keyed) stays as the T5 fallback
  # for broker exhaustion/auth failure.
  MODEL_BASE_URL = "https://chatgpt.com/backend-api/codex"
  MODEL_API = "responses"
  DELTA_MODEL_PRIMARY = "gpt-5.6-sol"
  DELTA_BROKER_TOKEN_URL = "https://delta-control-plane.fly.dev/api/broker/openai-token"
  MODEL_HEADERS = '{"originator":"codex_cli_rs"}'
  # Sol tuning (docs/report-sol-tuning-0.2.16.md): low effort — identical quality to
  # medium/high on hard tasks, fastest and most decisive. (Verbosity/summary knobs are
  # deliberately unset: unprobed on this backend, they would only trip the unmapped report.)
  DELTA_REASONING_EFFORT = "low"
  DELTA_MODEL_PRICES = '{"claude-opus-5":{"in":5,"out":25,"cacheRead":0.5},"claude-opus-4-8":{"in":5,"out":25,"cacheRead":0.5},"claude-haiku-4-5-20251001":{"in":1,"out":5,"cacheRead":0.1}}'
  DELTA_PROVIDERS = '[{"label":"openrouter","baseUrl":"https://openrouter.ai/api/v1","models":["anthropic/claude-opus-5","anthropic/claude-opus-4.8"],"apiKeyEnv":"OPENROUTER_API_KEY"}]'
  # utility on the main cascade: a Claude utility model is skipped on Responses providers, and
  # on the subscription lane the marginal cost of sol-served utility calls is ~$0 anyway.
  DELTA_UTILITY_MODEL = ""
  # identity + the safe-learning trio
  DELTA_AGENT_ID = "ferni"
  DELTA_AGENT_NAME = "Ferni"
  # trusted tier = every tool + full budget (max capabilities). Old name "work" still aliases.
  DELTA_PROFILE = "trusted"
  DELTA_ALLOW_SELF_WRITE = "1"
  DELTA_REFLECT = "1"
  # inspect write enables the /revert operator command; local skill folders live on the volume
  DELTA_INSPECT_WRITE = "1"
  DELTA_SKILLS = "local"
  # Engine telemetry to the control-plane collector. Ferni is not a provisioned machine, so
  # it authenticates with an operator token (TELEMETRY_TOKEN, a staged Fly secret) rather than
  # a gateway token - the ingest route dual-auths for exactly this case. Without
  # DELTA_CAPTURE_PAYLOADS the model.call/tool.* events export with NO model, latency, token or
  # cost attributes, which is the difference between a usable corpus and an empty one; it does
  # not export prompts or tool payloads. The exporter fails open and is never on a turn's path.
  TELEMETRY_URL = "https://delta-control-plane.fly.dev/api/telemetry/ingest"
  DELTA_CAPTURE_PAYLOADS = "1"
  # DELTA_CACHE_TTL removed with the codex-sol migration: it is an Anthropic-wire knob with no
  # mapping on the Responses wire (0.2.16 would name it on the boot line + /v1/status as
  # unmapped). The subscription backend auto-caches; explicit control returns if/when the
  # Delos probes admit prompt_cache_breakpoint on this host. If this lane ever moves back to
  # Anthropic, restore DELTA_CACHE_TTL = "1h" (rationale: Ferni is human-paced — messages are
  # hours apart, and the 5-minute TTL was cold on nearly every first turn; see 0.2.13 notes).
  # DELTA_CAPTURE_CALLS is deliberately OFF. It persisted the full request + response per call into
  # the `calls` table at ~95 KB a call, that table has no retention sweep (only session delete
  # clears it), and it had reached 16.5 MB of a 1 GB volume. 0.2.13's segmented prefix hashes now
  # localise a cache miss from telemetry alone, so the doctrine is: the cheap always-on signal says
  # WHICH segment moved, and capture gets switched on for one session only to find WHICH BYTE.
  # Turn it back on for a targeted confirmation, then off again.
  # generous budgets for real work
  DELTA_MAX_COST_USD = "15"
  DELTA_MAX_TOKENS = "3000000"
  DELTA_STEP_MAX_TOKENS = "16384"
  # Explicit rather than inherited (0.2.13). Unset sends no effort at all, so the lane silently took
  # the provider default and every arm in telemetry was unlabelled. `medium` is the fleet standard
  # set at the 0.2.6 rollout; the effort lab's own recommendation for chat-shaped work is `low`
  # (-56% p50, half cost, blind quality inside margin), which is the next thing worth testing here
  # now that gen_ai.request.effort ships on model.call and makes the arm self-labelling.
  DELTA_REASONING_EFFORT = "medium"
  # compact well below where Opus per-step latency + re-billed context get painful. 160k never fired
  # (heavy turns topped ~155k and re-sent it every step); 130k makes compaction actually kick in.
  # NOTE (0.2.13/S5): the retained tail is no longer derived from this number. It used to be
  # `ceiling - fixed - reserve` (~110k here), so a compaction landed just under the trigger and the
  # next turn pushed it straight back over. It is now a flat 24k low-water mark, so raising this
  # knob changes WHEN compaction fires, never how much it reclaims.
  DELTA_COMPACT_AT_TOKENS = "130000"
  # only Nic may talk to the bot (also gates the operator /restart /safemode /revert commands),
  # and intake REFUSES to start unless this is non-empty
  ALLOWED_TELEGRAM_USER_IDS = "5499639944"
  # secure secret intake (Connect 0.4.0 + Harness 0.2.10). DELTA_VAULT_KEY is a Fly secret.
  CONNECT_PUBLIC_URL = "https://ferni-delta-connect.fly.dev"
  CONNECT_PUBLIC_PORT = "8323"

[http_service]
  internal_port = 8323
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "ferni_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Secrets set out-of-band (never in this file):
#   flyctl secrets set OPENROUTER_API_KEY=... TELEGRAM_BOT_TOKEN=... \
#     DELTA_CONTROL_TOKEN=... DELTA_INSPECT_TOKEN=...
